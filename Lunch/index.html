<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>📌 급식 입장 안내</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
    <button class="left" onclick="location.href='../main/index.html'">
    <img src="image/left.png" alt="">
  </button>
  <h1>🍽️ 급식 입장 안내</h1>
  <div class="info">
    <div class="section">
      <h2>학년별 입장 시작 시간</h2>
      <table class="table">
        <tr><th>학년</th><th>입장 시작 시간</th></tr>
        <tr><td>3학년</td><td>13:00</td></tr>
        <tr><td>2학년</td><td>13:06</td></tr>
        <tr><td>1학년</td><td>13:10</td></tr>
      </table>
      <p class="note">각 과는 학년 내에서 3분 간격으로 순차 입장합니다.</p>
    </div>

    <div class="section">
      <h2>📅 월별 입장 순서 (과 기준)</h2>
      <table class="table">
        <tr>
          <th>월</th>
          <th>1순위</th>
          <th>2순위</th>
          <th>3순위</th>
          <th>4순위</th>
        </tr>
        <tr class="highlight">
          <td>3월</td>
          <td>전자과</td>
          <td>스마트과</td>
          <td>디자인과</td>
          <td>소프트과</td>
        </tr>
        <tr>
          <td>4월</td>
          <td>스마트과</td>
          <td>디자인과</td>
          <td>소프트과</td>
          <td>전자과</td>
        </tr>
        <tr class="highlight">
          <td>5월</td>
          <td>디자인과</td>
          <td>소프트과</td>
          <td>전자과</td>
          <td>스마트과</td>
        </tr>
        <tr>
          <td>6월</td>
          <td>소프트과</td>
          <td>전자과</td>
          <td>스마트과</td>
          <td>디자인과</td>
        </tr>
      </table>
      <p class="note">매달 순환하며 순위가 바뀝니다. 지난달 먼저 입장한 과는 이번 달엔 마지막!</p>
    </div>

  </div>
</body>
</html>
